name: 消息题材采集分析

on:
  # 定时触发 - 每小时运行一次（UTC 整点 = 北京时间整点）
  schedule:
    - cron: '0 * * * *'
  # 手动触发
  workflow_dispatch:

# 并发控制：同一时间只运行一个采集任务
concurrency:
  group: news-subject
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 添加超时限制，防止任务卡死
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install requests python-dotenv

      - name: 创建必要目录
        run: |
          mkdir -p data/news_subject

      - name: 执行消息题材采集分析
        env:
          # Gitee 配置
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ vars.GITEE_REPO || 'qymmdj/stockdb' }}

          # LLM 配置（DeepSeek，OpenAI 兼容接口）
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://api.deepseek.com/v1' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'deepseek-v4-pro' }}

          # 系统配置
          LOG_LEVEL: INFO

        run: |
          echo "=========================================="
          echo "📊 消息题材采集分析"
          echo "=========================================="
          echo "⏰ 时间: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"
          echo "🔑 Gitee Token: $([ -n "$GITEE_TOKEN" ] && echo '✅ 已配置' || echo '❌ 未配置')"
          echo "🔑 OpenAI API Key: $([ -n "$OPENAI_API_KEY" ] && echo '✅ 已配置' || echo '❌ 未配置（消息将不做价值分析）')"
          echo "=========================================="
          echo ""

          python src/qym/eastmoney/news/newsSubject.py

      - name: 上传采集数据
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: news-subject-data-${{ github.run_number }}
          path: data/news_subject/
          retention-days: 7

      - name: 显示运行结果
        if: always()
        run: |
          echo ""
          echo "=========================================="
          echo "📊 采集完成"
          echo "=========================================="
          if [ -d "data/news_subject" ] && [ "$(ls -A data/news_subject 2>/dev/null)" ]; then
            echo "采集的数据文件:"
            ls -la data/news_subject/
          else
            echo "⚠️ 未生成数据文件"
          fi
          echo "=========================================="
